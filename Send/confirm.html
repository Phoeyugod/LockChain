<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="confirm.css">
<title>Tranzakció megerősítése</title>

</head>
<body>

<div class="card">
    <h1>Tranzakció megerősítése</h1>
    <p>Ellenőrizze az adatokat</p>

    <div class="row">
        <div>Összeg</div>
        <div id="amount"></div>
    </div>

    <div class="row">
        <div>Cím</div>
        <div class="addr" id="address"></div>
    </div>

    <div class="row">
        <div>Hálózati díj</div>
        <div id="fee"></div>
    </div>

    <div class="row">
        <div>Total</div>
        <div id="total"></div>
    </div>

    <div class="warning">
        A kriptovaluta-tranzakciók nem vonhatók vissza.
    </div>

    <button class="send-btn">Küldés</button>
</div>

<!-- Popup -->
<div id="popup" class="popup">
  <div class="popup-content">
    <h2>Tranzakció sikeres!</h2>
    <p>A tranzakciót sikeresen elküldtük.</p>
    <button id="okBtn">OK</button>
  </div>
</div>

<script>

    // ===== WALLET INIT =====
    let wallet = JSON.parse(localStorage.getItem("wallet"));
    
    if (!wallet) {
        wallet = {
            usd: 10000,
            AXLX: 5,
            NRVX: 5
        };
        localStorage.setItem("wallet", JSON.stringify(wallet));
    }
    
    const tx = JSON.parse(localStorage.getItem("txData"));
    
    if (!tx) {
        alert("Nincs tranzakció adat!");
    }
    
    // ===== VÉGREHAJTÁS =====
    document.querySelector(".send-btn").addEventListener("click", function () {
    
        if (tx.type === "buy") {
    
            const totalCost = tx.usd + tx.fee;
    
            wallet.usd -= totalCost;
            wallet[tx.symbol] += tx.amount;
    
        }
    
        if (tx.type === "send") {
    
            wallet[tx.symbol] -= tx.amount;
    
        }
    
        localStorage.setItem("wallet", JSON.stringify(wallet));
    
        document.getElementById("popup").style.display = "flex";
    
    });
    
    document.getElementById("okBtn").addEventListener("click", function () {
        window.location.href = "../Portfolio/portfolio.html";
    });
    
    </script>
    
    
    
</body>
</html>
