<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="confirm.css">
<title>Tranzakció megerősítése</title>
</head>

<body>
<div class="wrap">
<div class="confirm-card">

    <!-- fejléc -->
    <div class="header">
        <h1>Tranzakció megerősítése</h1>
        <p>Kérjük tekintse át a tranzakció adatait</p>
    </div>

    <!-- adatok -->
    <div class="summary">

        <div class="row">
            <div class="label">Összeg</div>
            <div class="value">
                <strong>0.5432 AXLX</strong>
                <div class="sub">≈ $21,456.40</div>
            </div>
        </div>

        <div class="row">
            <div class="label">Cím</div>
            <div class="value address">
                bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
            </div>
        </div>

        <div class="row">
            <div class="label">Hálózati díj</div>
            <div class="value">
                <strong>$1.25</strong>
                <div class="sub">Normal (~10 min)</div>
            </div>
        </div>

        <div class="row">
            <div class="label">Total</div>
            <div class="value">
                <strong>0.5432 AXLX</strong>
                <div class="sub">+ $1.25 fee</div>
            </div>
        </div>

    </div>

    <!-- warning -->
    <div class="warning">
        Kérjük, ellenőrizze a címet.  
        A kriptovaluta-tranzakciók nem vonhatók vissza.
    </div>

    <!-- CTA -->
    <div class="actions">
        <button class="send-btn">Küldés</button>
    </div>

</div>
</div>
</body>
</html>
