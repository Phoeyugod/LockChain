<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="send.css">
<title>Tranzakció oldal</title>
<style>

</style>
</head>
<body>
<div class="container">

    <h2>Valuta Kiválasztása</h2>

    <div class="coin-card selected" data-coin="NRVX">
        <div class="coin-info">
            <h3>Narvex</h3>
            <p>NRVX</p>
        </div>
        <div class="balance">0.5432 NRVX</div>
    </div>

    <div class="coin-card" data-coin="AXLX">
        <div class="coin-info">
            <h3>Anolux</h3>
            <p>AXLX</p>
        </div>
        <div class="balance">0.9876 AXLX</div>
    </div>

    <!-- Összeg kártya -->
    <div class="card">
        <div class="input-group">
            <input type="number" id="amount" placeholder="0.0" step="0.0001" value="0.0">
            <button onclick="setMax()">Max</button>
        </div>
        <div class="usd-label">≈ $<span id="usdAmount">0.00</span></div>
    </div>

    <!-- Vevő címe kártya -->
    <div class="card">
        <div class="input-group">
            <input type="text" id="receiver" placeholder="Vevő címe">
            <button onclick="scanQR()">📷</button>
        </div>
    </div>

    <!-- Hálózati díj kártya -->
    <div class="card slider-group">
        <label>Hálózati díj</label>
        <input type="range" id="feeSlider" min="0.5" max="2.8" step="0.01" value="1.25" oninput="updateFee()">
        <div class="slider-labels">
            <span>Slow $0.50</span>
            <span>Fast $2.80</span>
        </div>
        <div class="slider-value" id="feeLabel">$1.25</div>
    </div>

    <!-- Gomb -->
    <button class="submit-btn" onclick="reviewTransaction()">Tranzakció Felülvizsgálata</button>

</div>

<script>
const coins = {
    NRVX:{balance:0.5432, price:39500},
    AXLX:{balance:0.9876, price:42100}
};

let selectedCoin = 'NRVX';

const coinCards = document.querySelectorAll('.coin-card');
const amountInput = document.getElementById('amount');
const usdAmountLabel = document.getElementById('usdAmount');
const feeSlider = document.getElementById('feeSlider');
const feeLabel = document.getElementById('feeLabel');

coinCards.forEach(card=>{
    card.addEventListener('click',()=>{
        coinCards.forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        selectedCoin = card.getAttribute('data-coin');
        updateUSD();
    });
});

function setMax(){
    amountInput.value = coins[selectedCoin].balance.toFixed(4);
    updateUSD();
}

function updateUSD(){
    const amount = parseFloat(amountInput.value)||0;
    usdAmountLabel.textContent = (amount * coins[selectedCoin].price).toFixed(2);
}

function updateFee(){
    feeLabel.textContent = "$" + parseFloat(feeSlider.value).toFixed(2);
}

function scanQR(){
    alert("QR kód beolvasás funkció itt lenne.");
}

function reviewTransaction(){
    const amount = parseFloat(amountInput.value)||0;
    const receiver = document.getElementById('receiver').value;
    const fee = parseFloat(feeSlider.value)||0;

    if(amount<=0 || !receiver){
        alert("Kérlek adj meg egy érvényes összeget és vevő címet.");
        return;
    }
    if(amount > coins[selectedCoin].balance){
        alert("Nincs elég " + selectedCoin + " a számlán.");
        return;
    }

    alert(`Összeg: ${amount} ${selectedCoin} ≈ $${(amount*coins[selectedCoin].price).toFixed(2)}\nVevő: ${receiver}\nHálózati díj: $${fee.toFixed(2)}`);
}

amountInput.addEventListener('input', updateUSD);
updateUSD();
updateFee();
</script>
</body>
</html>
