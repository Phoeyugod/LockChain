<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="send.css">
<title>Wallet – Tranzakció</title>


</head>

<body>
<div class="page-wrap">
<div class="wallet-card">
<div class="container">

    <!-- VALUTA -->
    <div class="card">
        <div class="dropdown" id="dropdown">
            <button class="dropdown-btn" onclick="toggleDropdown()">
                <span id="selectedCoin">Narvex (NRVX)</span>
                <span>▾</span>
            </button>
            <div class="dropdown-menu">
                <div class="dropdown-item active" onclick="selectCoin('NRVX')">
                    Narvex <span>NRVX</span>
                </div>
                <div class="dropdown-item" onclick="selectCoin('AXLX')">
                    Axolux <span>AXLX</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ÖSSZEG -->
    <div class="card">
        <div class="input-group">
            <input type="number" id="amount" placeholder="0.0">
            <button onclick="setMax()">Max</button>
        </div>
        <div class="usd-label">≈ $<span id="usd">0.00</span></div>
    </div>

    <!-- CÍM -->
    <div class="card">
        <div class="input-group">
            <input id="address" type="text" placeholder="bc1qxy2kgdygjrsq...">
            <button>📷</button>
        </div>
    </div>
    

    <!-- DÍJ -->
    <div class="card">
        <div class="slider-title">Hálózati díj</div>
        <input type="range" min="0.5" max="2.8" step="0.01" value="1.25" oninput="updateFee(this.value)">
        <div class="slider-labels">
            <span>Slow $0.50</span>
            <span>Fast $2.80</span>
        </div>
        <div class="slider-value">$<span id="fee">1.25</span></div>
    </div>

    <!-- GOMB -->
    <button class="submit-btn" onclick="goToConfirm()" button onclick="window.location.href='../Send/confirm.html'">Tranzakció Felülvizsgálata</button>

</div>

<script>

    // ===== WALLET INIT =====
    let wallet = JSON.parse(localStorage.getItem("wallet"));
    
    if (!wallet) {
        wallet = {
            usd: 10000,
            AXLX: 5,
            NRVX: 5
        };
        localStorage.setItem("wallet", JSON.stringify(wallet));
    }
    
    // ===== COIN PRICES =====
    const coins = {
        NRVX: { price: 244 },
        AXLX: { price: 395 }
    };
    
    let selected = 'NRVX';
    
    // ===== DROPDOWN =====
    function toggleDropdown() {
        document.getElementById("dropdown").classList.toggle("open");
    }
    
    function selectCoin(symbol) {
    
        selected = symbol;
    
        // cím frissítés
        document.getElementById("selectedCoin").innerText =
            symbol === "NRVX" ? "Narvex (NRVX)" : "Axolux (AXLX)";
    
        // active class váltás
        document.querySelectorAll(".dropdown-item")
            .forEach(item => item.classList.remove("active"));
    
        event.target.closest(".dropdown-item").classList.add("active");
    
        toggleDropdown();
        updateUSD();
    }
    
    // ===== USD SZÁMOLÁS =====
    document.getElementById("amount").addEventListener("input", updateUSD);
    
    function updateUSD() {
        const amount = parseFloat(document.getElementById("amount").value) || 0;
        const usdValue = amount * coins[selected].price;
    
        document.getElementById("usd").innerText =
            usdValue.toFixed(2);
    }
    
    // ===== MAX =====
    function setMax() {
        document.getElementById("amount").value =
            wallet[selected].toFixed(4);
    
        updateUSD();
    }
    
    // ===== FEE SLIDER =====
    function updateFee(value) {
        document.getElementById("fee").innerText =
            parseFloat(value).toFixed(2);
    }
    
    // ===== CONFIRM =====
    function goToConfirm() {
    
        const amount = parseFloat(document.getElementById("amount").value) || 0;
    
        if (amount <= 0) {
            alert("Adj meg mennyiséget!");
            return;
        }
    
        if (amount > wallet[selected]) {
            alert("Nincs ennyi coinod!");
            return;
        }
    
        const txData = {
    type: "send",
    amount: amount,
    symbol: selected,
    usdValue: amount * coins[selected].price,
    fee: parseFloat(document.getElementById("fee").innerText),
    address: document.getElementById("address").value
};
    
        localStorage.setItem("txData", JSON.stringify(txData));
    
        window.location.href = "confirm.html";
    }
    
    </script>
    
</body>
</html>
