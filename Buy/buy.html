<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kripto Vásárlás</title>
<link rel="stylesheet" href="../Send/send.css"> <!-- ugyanaz a stílus mint send.html -->
</head>
<body>
<div class="page-wrap">
  <div class="wallet-card">
    <div class="container">

      <!-- VALUTA -->
      <div class="card">
        <div style="font-size:14px; opacity:.7;">Elérhető USD egyenleg</div>
        <div style="font-size:20px; font-weight:600;">
          $<span id="usdBalance">0.00</span>
        </div>
      </div>
      

      <div class="card">
        <div class="dropdown" id="dropdown">
          <button class="dropdown-btn" onclick="toggleDropdown()">
            <span id="selectedCoin">Narvex (NRVX)</span>
            <span>▾</span>
          </button>
          <div class="dropdown-menu">
            <div class="dropdown-item active" onclick="selectCoin('NRVX')">Narvex <span>NRVX</span></div>
            <div class="dropdown-item" onclick="selectCoin('AXLX')">Axolux <span>AXLX</span></div>
          </div>
        </div>
      </div>

      <!-- ÖSSZEG -->
      <div class="card">
        <div class="input-group">
          <input type="number" id="amount" placeholder="0.0">
          <button onclick="setMax()">Max</button>
        </div>
        <div class="usd-label">≈ $<span id="usd">0.00</span></div>
      </div>

      <!-- DÍJ -->
      <div class="card">
        <div class="slider-title">Hálózati díj</div>
        <input type="range" min="0.5" max="2.8" step="0.01" value="1.25" oninput="updateFee(this.value)">
        <div class="slider-labels">
          <span>Slow $0.50</span>
          <span>Fast $2.80</span>
        </div>
        <div class="slider-value">$<span id="fee">1.25</span></div>
      </div>

      <!-- GOMB -->
      <button class="submit-btn" onclick="goToConfirm()">Vásárlás Ellenőrzése</button>

    </div>
  </div>
</div>

<script>

  // ===== WALLET INIT =====
  let wallet = JSON.parse(localStorage.getItem("wallet"));
  
  if (!wallet) {
      wallet = {
          usd: 10000,
          AXLX: 5,
          NRVX: 5
      };
      localStorage.setItem("wallet", JSON.stringify(wallet));
  }
  
  // USD egyenleg kiírás
  document.getElementById("usdBalance").textContent =
      Number(wallet.usd).toFixed(2);
  
  // ===== COIN ÁRAK =====
  const coins = {
      NRVX: { price: 2440 },
      AXLX: { price: 3950 }
  };
  
  let selected = "NRVX";
  
  // ===== DROPDOWN =====
  function toggleDropdown() {
      document.getElementById("dropdown").classList.toggle("open");
  }
  
  function selectCoin(symbol) {
  
      selected = symbol;
  
      document.getElementById("selectedCoin").innerText =
          symbol === "NRVX"
              ? "Narvex (NRVX)"
              : "Axolux (AXLX)";
  
      document.querySelectorAll(".dropdown-item")
          .forEach(i => i.classList.remove("active"));
  
      const items = document.querySelectorAll(".dropdown-item");
      items.forEach(item => {
          if (item.innerText.includes(symbol)) {
              item.classList.add("active");
          }
      });
  
      toggleDropdown();
      updateUSD();
  }
  
  // ===== USD SZÁMÍTÁS =====
  function updateUSD() {
  
      const amount =
          Number(document.getElementById("amount").value) || 0;
  
      const usdValue =
          amount * coins[selected].price;
  
      document.getElementById("usd").textContent =
          usdValue.toFixed(2);
  }
  
  document.getElementById("amount")
      .addEventListener("input", updateUSD);
  
  // ===== FEE =====
  function updateFee(value) {
      document.getElementById("fee").innerText =
          Number(value).toFixed(2);
  }
  
  // ===== MAX =====
  function setMax() {
  
      const fee =
          Number(document.getElementById("fee").innerText);
  
      const maxUsd = wallet.usd - fee;
  
      if (maxUsd <= 0) {
          alert("Nincs elég USD a díj levonása után.");
          return;
      }
  
      const maxCoin =
          maxUsd / coins[selected].price;
  
      document.getElementById("amount").value =
          maxCoin.toFixed(6);
  
      updateUSD();
  }
  
  // ===== CONFIRM =====
  function goToConfirm() {
  
      const amount =
          Number(document.getElementById("amount").value);
  
      if (!amount || amount <= 0) {
          alert("Adj meg érvényes mennyiséget!");
          return;
      }
  
      const usd =
          amount * coins[selected].price;
  
      const fee =
          Number(document.getElementById("fee").innerText);
  
      const totalCost = usd + fee;
  
      if (totalCost > wallet.usd) {
          alert("Nincs elegendő USD egyenleged!");
          return;
      }
  
      const txData = {
          type: "buy",
          amount: Number(amount),
          symbol: selected,
          usd: Number(usd),
          fee: Number(fee),
          total: Number(totalCost)
      };
  
      localStorage.setItem("txData", JSON.stringify(txData));
  
      window.location.href = "../Send/confirm.html";
  }
  
  </script>
</body>
</html>
