<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Beallitasok.css">
  <title>Beállítások</title>
</head>
  <body class="meret-kozepes">
    <div class="oldal">
      <div class="kontener">
  
        <div class="fejlec">
          <h1 class="focim">Beállítások</h1>
          <p class="alcim">Szabja testre pénztárca-élményét</p>
        </div>
  
        <!-- Fülek -->
        <div class="ful-sor">
          <button class="ful-gomb aktiv" type="button" data-tab="kinezet">Kinézet</button>
          <button class="ful-gomb" type="button" data-tab="tarca">Tárca</button>
          <button class="ful-gomb" type="button" data-tab="vedelem">Védelem</button>
          <button class="ful-gomb" type="button" data-tab="rolunk">Rólunk</button>
        </div>
  
        <!-- TAB: Kinézet -->
        <div id="tab-kinezet" class="tab-tartalom aktiv">
  
          <div class="panel">
            <div class="szekcio-cim">Témák</div>
  
            <div class="tema-racs">
              <div id="temaVilagos" class="tema-kartya" role="button" tabindex="0">
                <div class="tema-jel"></div>
                <div class="tema-minta vilagos"></div>
                <div class="tema-felirat">Világos</div>
              </div>
  
              <div id="temaSotet" class="tema-kartya aktiv" role="button" tabindex="0">
                <div class="tema-jel"></div>
                <div class="tema-minta sotet"></div>
                <div class="tema-felirat">Sötét</div>
              </div>
            </div>
          </div>
  
          <div class="panel">
            <div class="sor">
              <div class="sor-cim">Betű méret</div>
              <select id="betuMeretValaszto" class="valaszto">
                <option value="kicsi">Kicsi</option>
                <option value="kozepes" selected>Közepes</option>
                <option value="nagy">Nagy</option>
              </select>
            </div>
          </div>
  
        </div>
  
        <!-- TAB: Tárca -->
        <!-- TAB: Tárca (bemásolható rész) -->
<div id="tab-tarca" class="tab-tartalom">

  <div class="panel">
    <!-- 1. kártya -->
    <button type="button" class="beallitas-sor" id="sorKezdomondat">
      <div class="sor-bal">
        <div class="sor-cim" data-hu="Seed phrase szavak megjelenítése" data-en="Show recovery phrase">
          Kezdőmondat megjelenítése
        </div>
        <div class="sor-leiras" data-hu="Helyreállító szavak megtekintése" data-en="View your recovery phrase">
          Helyreállító mondat megtekintése
        </div>
      </div>
      <div class="sor-jobb" aria-hidden="true">&gt;</div>
    </button>

    <!-- 2. kártya -->
    <button type="button" class="beallitas-sor" id="sorBiztMentes">
      <div class="sor-bal">
        <div class="sor-cim" data-hu="Biztonsági mentés exportálása" data-en="Export backup">
          Biztonsági mentés exportálása
        </div>
        <div class="sor-leiras" data-hu="Titkosított biztonsági mentés exportálása" data-en="Export an encrypted backup">
          Titkosított biztonsági mentés exportálása
        </div>
      </div>
      <div class="sor-jobb" aria-hidden="true">&gt;</div>
    </button>

    <!-- 3. kártya: Nyelv -->
    <div class="nyelv-kartya">
      <div class="nyelv-fejlec">
        <div class="nyelv-cim" data-hu="Nyelv" data-en="Language">Nyelv</div>
      </div>

      <button type="button" class="nyelv-valaszto" id="nyelvValaszto">
        <span id="nyelvErtek" class="nyelv-ertek">Magyar</span>
        <span class="nyelv-nyil" aria-hidden="true">&gt;</span>
      </button>

      <!-- lenyíló lista (IE11-safe) -->
      <div id="nyelvLista" class="nyelv-lista">
        <button type="button" class="nyelv-opcio" data-lang="hu">Magyar</button>
        <button type="button" class="nyelv-opcio" data-lang="en">English</button>
      </div>
    </div>
  </div>

</div>

  
        <!-- TAB: Védelem -->
        <div id="tab-vedelem" class="tab-tartalom">
          <div class="panel">
            <div class="szekcio-cim">Védelem</div>
            <div style="color: rgba(255,255,255,0.75); font-size: 13px;">
              Ide jöhetnek a biztonsági beállítások (PIN, 2FA, automatikus zárolás).
            </div>
          </div>
        </div>
  
        <!-- TAB: Rólunk -->
        <div id="tab-rolunk" class="tab-tartalom">
          <div class="panel">
            <div class="szekcio-cim">Rólunk</div>
            <div style="color: rgba(255,255,255,0.75); font-size: 13px;">
              Verzió, licenc, támogatás, kapcsolat, stb.
            </div>
          </div>
        </div>
  
      </div>
    </div>
    <script src="Beallitasok.js"></script>
</body>
</html>
