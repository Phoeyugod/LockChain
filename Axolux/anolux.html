<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axolux Wallet</title>
    <link rel="stylesheet" href="anolux.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="oldal">
      <div class="panel">
  
          <!-- fejléc -->
          <div class="fejlec">
              <div class="coin-info">
                  <div class="ikon"></div>
                  <div>
                      <h1>Axolux (AXLX)</h1>
                      <p class="ar">$39,500.00 <span class="novekedes">+5.3%</span></p>
                  </div>
              </div>
  
              <div class="egyenleg">
                  <p>Egyenleg</p>
                  <h2>0.5432 AXLX</h2>
                  <span>$21,456.78</span>
              </div>
          </div>
  
          <!-- gombok -->
          <div class="gombok">
              <button>Küldés</button>
              <button>Fogadás</button>
              <button>Vásárlás</button>
              <button>Eladás</button>
              <button>Csere</button>
          </div>
  
          <div class="chart-kartya">

            <div class="grafikon">
                <canvas id="arfolyamGrafikon"></canvas>
            </div>
        
            <div class="ido-intervallum">
                <button class="aktiv" data-idotav="24h">24h</button>
                <button data-idotav="7d">7d</button>
                <button data-idotav="1m">1m</button>
                <button data-idotav="1y">1y</button>
            </div>
        
        </div>
  
          <!-- tranzakciók -->
          <div class="tranzakciok">
              <h3>Tranzakció Történet</h3>
  
              <div class="tranzakcio pozitiv">
                  <span>Fogadott</span>
                  <span>+0.0523 AXLX</span>
              </div>
              <div class="tranzakcio negativ">
                  <span>Elküldött</span>
                  <span>-0.0100 AXLX</span>
              </div>
              <div class="tranzakcio pozitiv">
                  <span>Vásárolt</span>
                  <span>+0.1500 AXLX</span>
              </div>
          </div>
  
      </div>
  </div>
  <script src="anolux.js"></script>
  </body>
  
  
</html>
