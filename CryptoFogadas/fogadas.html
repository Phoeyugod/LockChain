          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" href="fogadas.css">

            <title>Document</title>
          </head>
          


            <body>

              <header>
                <a href="/Portfolio/portfolio.html">
                  <button id="Hportfolio">
                    <h2 id="PortfolioSz">Portfólió</h2>
                  </button>
                </a>
              
                <a href="/Beallitasok/Beallitasok.html">
                  <img id="beallitaskep" src="/Képek/Beállítások.png">
                </a>
              
                <a href="/Malacpersely/malacpersely.html">
                  <img id="malacperselykep" src="/Képek/malackep.png">
                </a> 
              </header>
        
        

                <div class="oldal">
                  <div class="kartya">
                    <div class="fejlec">
                      <div class="cim">Crypto fogadása</div>
                      <div class="alcim">Olvasd be a QR-kódot, vagy oszd meg a címed</div>
                    </div>
              
                    <div class="qr-resz">
                        <div class="qr-kartya">
                          <img id="qrKep" class="qr-kep" src="/Képek/QRkod.png" alt="QR-kód">

                        </div>
                      </div>
                      
              
                    <div class="cim-doboz">
                      <div class="cim-felirat">Az Ön AXI X-címe</div>
                      <input id="cimInput" class="cim-input" type="text" value="bc1qxy2kgdygir5qtzq2n0yr2493p83kkfjhx0wh" readonly >
                      <div id="cimErtek" class="cim-ertek"></div>
                    </div>
              
                    <div class="muveletek">
                        <button id="masolasGomb" class="gomb gomb-szellem" type="button">
                            <span class="ikon-masolas" aria-hidden="true"></span>
                            <span>Cím másolása</span>
                          </button>
                      </button>
              
                      <button id="megosztasGomb" class="gomb gomb-elsoleges" type="button">
                        Megosztás
                      </button>

              
                      <div id="visszajelzes" class="visszajelzes" aria-live="polite"></div>
                    </div>
                  </div>
                </div>
              



                <!-- Megosztás menü (modal) -->
                <div id="megosztasHatter" class="megosztas-hatter" aria-hidden="true">
                  <div class="megosztas-modal" role="dialog" aria-modal="true">
                    <div class="megosztas-fejlec">
                      <div class="megosztas-cim">Megosztás</div>
                      <button id="megosztasBezar" class="megosztas-bezar" type="button">×</button>
                    </div>
                
                    <div class="megosztas-tartalom">
                      <div class="megosztas-leiras">
                        Válassz egy lehetőséget.
                      </div>
                
                      <div class="megosztas-gombok">
                        <button id="messengerGomb" class="megosztas-opcio" type="button">
                          Messenger
                          <span class="megosztas-alcim">cím másolása + megnyitás</span>
                        </button>
                
                        <button id="instagramGomb" class="megosztas-opcio" type="button">
                          Instagram
                          <span class="megosztas-alcim">cím másolás + megnyitás</span>
                        </button>
                
                        <button id="qrMegnyitasGomb" class="megosztas-opcio" type="button">
                          QR-kód megnyitása
                          <span class="megosztas-alcim">új lapon (menthető)</span>
                        </button>
                
                        <button id="cimMasolasGomb2" class="megosztas-opcio" type="button">
                          Cím másolása
                          <span class="megosztas-alcim">vágólapra</span>
                        </button>
                      </div>
                
                      <div id="megosztasUzenet" class="megosztas-uzenet" aria-live="polite"></div>
                    </div>
                  </div>
                </div>
                
                <script src="fogadas.js"></script>
                <script>
                  (function () {
                    var tema = localStorage.getItem("tema");
                    var ikon = document.getElementById("beallitaskep");
                  
                    if (tema === "vilagos") {
                      document.body.classList.add("tema-vilagos");
                      document.body.classList.remove("tema-sotet");
                  
                      if (ikon) ikon.src = "/Képek/feketefogaskerek.png";
                  
                    } else {
                      document.body.classList.add("tema-sotet");
                      document.body.classList.remove("tema-vilagos");
                  
                      if (ikon) ikon.src = "/Képek/Beállítások.png";
                    }
                  })();
                  </script>
          </body>
          </html>
