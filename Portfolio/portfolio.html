<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>LockChain Wallet – Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="portfolio.css">
</head>

<body>

  <header>
    <a href="/Portfolio/portfolio.html" ><button id="Hportfolio"><h2 id="PortfolioSz">Portfólió</h2></button> </a>
    <a href="/Beallitasok/Beallitasok.html"><img id="beallitaskep" src="/Képek/Beállítások.png" alt="beállítások"></a>
    <a href="/Malacpersely/malacpersely.html"><img id="malacperselykep" src="/Képek/malackep.png" alt="Malacperselykep"></a> 
 </header>

  <!-- ===== PORTFOLIO CARD ===== -->
  <div class="portfolio-card">
    <div class="portfolio-top">
      <div>
        <div class="label">Total Portfólió Egyenleg</div>
        <div class="balance">
          <div class="total-balance">
            <h2 id="totalPortfolio"></h2>
          </div>
          <span class="change positive"></span>
        </div>
      </div>
    </div>   

    <div class="actions" class="akcio-gomb">
      <button class="action" onclick="window.location.href='../Send/send.html'">
        <span>✈️</span>
        Küldés
      </button>
     <button class="action" onclick="window.location.href='../CryptoFogadas/fogadas.html'">
        <span>⬇️</span>
        Fogadás
      </button>
      <button class="action" onclick="window.location.href='../Buy/buy.html'">
        <span>$</span>
        Vásárlás
      </button>
      <button class="action" onclick="window.location.href='../Sell/sell.html'">$ Eladás</button>
        <span></span>
        
      </button>
    </div>
  </div>

  <!-- ===== ASSET LIST ===== -->
  <div class="asset-list">

    <div class="asset" onclick="window.location.href='../Axolux/anolux.html'">
      <div class="asset-left">
        <div class="icon axlux"></div>
        <div>
          <div class="name">Axolux <span>AXLX</span></div>
          <div class="amount" id="axlxAmount"></div>
        </div>
      </div>
      <div class="asset-right">
        <div class="price" id="axlxPrice"></div>
        <div class="percent positive">+5.23%</div>
      </div>
    </div>
  
    <div class="asset" onclick="window.location.href='../Narvex/narvex.html'">
      <div class="asset-left">
        <div class="icon narvex"></div>
        <div>
          <div class="name">Narvex <span>NRVX</span></div>
          <div class="amount" id="nrvxAmount"></div>
        </div>
      </div>
      <div class="asset-right">
        <div class="price" id="nrvxPrice"></div>
        <div class="percent negative">-2.15%</div>
      </div>
    </div>
  
  </div>
  <script>

    // ===== WALLET BETÖLTÉS =====
function getWallet(){
  let wallet = JSON.parse(localStorage.getItem("wallet"));

  if(!wallet){
    wallet = {
      usd: 10000,
      AXLX: 5,
      NRVX: 5
    };
    localStorage.setItem("wallet", JSON.stringify(wallet));
  }

  return wallet;
}

// Demo árak
const prices = {
  AXLX: 3950,
  NRVX: 2440
};

function updatePortfolio(){

  const wallet = getWallet();

  // AXLX
  const axlxAmount = wallet.AXLX;
  const axlxValue = axlxAmount * prices.AXLX;

  document.getElementById("axlxAmount").textContent =
    axlxAmount.toFixed(3) + " AXLX";

  document.getElementById("axlxPrice").textContent =
    "$" + axlxValue.toLocaleString(undefined, {maximumFractionDigits: 2});

  // NRVX
  const nrvxAmount = wallet.NRVX;
  const nrvxValue = nrvxAmount * prices.NRVX;

  document.getElementById("nrvxAmount").textContent =
    nrvxAmount.toFixed(3) + " NRVX";

  document.getElementById("nrvxPrice").textContent =
    "$" + nrvxValue.toLocaleString(undefined, {maximumFractionDigits: 2});

// --- TOTAL ---
const total =
  wallet.usd +
  axlxValue +
  nrvxValue;

document.getElementById("totalPortfolio").textContent =
  "$" + total.toLocaleString(undefined, {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
    
}

// első betöltés
updatePortfolio();

// ha másik tabon változik
window.addEventListener("storage", function(e){
  if(e.key === "wallet"){
    updatePortfolio();
  }
});
    </script>
    
    
</body>
</html>
