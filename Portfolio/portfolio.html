<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>LockChain Wallet – Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="portfolio.css">
</head>

<body>

  <header>
    <a href="/Portfolio/portfolio.html" ><button id="Hportfolio"><h2 id="PortfolioSz">Portfólió</h2></button> </a>
    <a href=""><img id="beallitaskep" src="/Képek/Beállítások.png" alt="beállítások"></a>
    <a href="/Malacpersely/malacpersely.html"><img id="malacperselykep" src="/Képek/malackep.png" alt="Malacperselykep"></a> 
 </header>

  <!-- ===== PORTFOLIO CARD ===== -->
  <div class="portfolio-card">
    <div class="portfolio-top">
      <div>
        <div class="label">Total Portfólió Egyenleg</div>
        <div class="balance">
          $29,291.00
          <span class="change positive">+3.45%</span>
        </div>
      </div>
    </div>

    <div class="actions" class="akcio-gomb">
      <button class="action" onclick="window.location.href='../Send/send.html'">
        <span>✈️</span>
        Küldés
      </button>
     <button class="action" onclick="window.location.href='../CryptoFogadas/fogadas.html'">
        <span>⬇️</span>
        Fogadás
      </button>
      <button class="action" onclick="window.location.href='../Buy/buy.html'">
        <span>$</span>
        Vásárlás
      </button>
      <button class="action">
        <span>$</span>
        Eladás
      </button>
    </div>
  </div>

  <!-- ===== ASSET LIST ===== -->
  <div class="asset-list">

    <div class="asset" button onclick="window.location.href='../Axolux/anolux.html'"></button>
      <div class="asset-left">
        <div class="icon axlux"></div>
        <div>
           <div class="name">Axolux <span>AXLX</span></div>
          <div class="amount">0.5432 AXLX</div>
        </div>
      </div>
      <div class="asset-right">
        <div class="price">$21,456.78</div>
        <div class="percent positive">+5.23%</div>
      </div>
    </div>

    <div class="asset" button onclick="window.location.href='../Narvex/narvex.html'">
      <div class="asset-left">
        <div class="icon narvex"></div>
        <div>
          <div class="name">Narvex <span>NRVX</span></div>
          <div class="amount">3.2145 NRVX</div>
        </div>
      </div>
      <div class="asset-right">
        <div class="price">$7,834.22</div>
        <div class="percent negative">-2.15%</div>
      </div>
    </div>

  </div>

</body>
</html>
