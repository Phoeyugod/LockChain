<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Eladás</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:system-ui,-apple-system;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 20% 30%, #1e2a78 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, #3b1e78 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, #0f1433 0%, #070b1f 100%);
  background-size:200% 200%;
  animation: backgroundMove 18s ease infinite;
  color:white;
}

@keyframes backgroundMove{
  0%{ background-position:0% 50%,100% 50%,50% 50%; }
  50%{ background-position:100% 50%,0% 50%,50% 60%; }
  100%{ background-position:0% 50%,100% 50%,50% 50%; }
}

.card{
  width:420px;
  padding:35px;
  border-radius:28px;
  background:rgba(18,22,40,.55);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

h1{
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  opacity:.6;
  margin-bottom:25px;
  font-size:14px;
}

select,input{
  width:100%;
  height:50px;
  margin-bottom:18px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.05);
  color:white;
  padding:0 15px;
  font-size:15px;
}

input::placeholder{
  color:rgba(255,255,255,.4);
}

button{
  width:100%;
  height:50px;
  border:none;
  border-radius:20px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  background:linear-gradient(90deg,#ff5a5a,#ff2e63);
  transition:.25s;
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 0 25px rgba(255,80,80,.6);
}

.info{
  margin-top:18px;
  font-size:14px;
  text-align:center;
  opacity:.85;
}

.balance-box{
  margin-bottom:18px;
  font-size:13px;
  opacity:.7;
}

</style>
</head>
<body>

<div class="card">

  <h1>Coin Eladás</h1>
  <div class="subtitle">Add el kriptódat USD-ért</div>

  <div class="balance-box" id="balanceInfo"></div>

  <select id="coinSelect">
    <option value="AXLX">Axolux (AXLX)</option>
    <option value="NRVX">Narvex (NRVX)</option>
  </select>

  <input type="number" id="amountInput" placeholder="Eladni kívánt mennyiség">

  <button onclick="sellCoin()">Eladás</button>

  <div class="info" id="infoText"></div>

</div>

<script>

  // ===== WALLET INIT =====
  let wallet = JSON.parse(localStorage.getItem("wallet"));
  
  if (!wallet) {
      wallet = {
          usd: 10000,
          AXLX: 5,
          NRVX: 5
      };
      localStorage.setItem("wallet", JSON.stringify(wallet));
  }
  
  // ===== DEMO ÁRAK =====
  const prices = {
      AXLX: 395,
      NRVX: 244
  };
  
  function updateBalanceInfo() {
  
      const coin = document.getElementById("coinSelect").value;
  
      document.getElementById("balanceInfo").innerText =
          "Elérhető: " + wallet[coin].toFixed(4) + " " + coin +
          " | USD egyenleg: $" + wallet.usd.toFixed(2);
  }
  
  updateBalanceInfo();
  document.getElementById("coinSelect").addEventListener("change", updateBalanceInfo);
  
  function sellCoin() {
  
      const coin = document.getElementById("coinSelect").value;
      const amount = parseFloat(document.getElementById("amountInput").value);
  
      if (isNaN(amount) || amount <= 0) {
          alert("Adj meg érvényes mennyiséget!");
          return;
      }
  
      if (amount > wallet[coin]) {
          alert("Nincs ennyi coinod!");
          return;
      }
  
      const usdValue = amount * prices[coin];
  
      wallet[coin] -= amount;
      wallet.usd += usdValue;
  
      localStorage.setItem("wallet", JSON.stringify(wallet));
  
      document.getElementById("infoText").innerHTML =
          "Sikeres eladás! +$" + usdValue.toFixed(2) + " jóváírva.";
  
      document.getElementById("amountInput").value = "";
  
      updateBalanceInfo();
  }
  
  </script>
  
</body>
</html>
